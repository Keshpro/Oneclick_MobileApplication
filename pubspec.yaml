# Flutter project name
name: oneclick

# Short description of the app
description: "OneClick mobile application"

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# App version and build number
version: 1.0.0+1

# Required Dart SDK version
environment:
  sdk: ^3.13.0

# Packages used by the app
dependencies:
  flutter:
    sdk: flutter

  url_launcher: 6.3.3

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Connect and initialize Firebase
  firebase_core: ^4.15.0

  # User registration, login, and password reset
  firebase_auth: ^6.7.0

  # Store user profiles, roles, and approval status
  cloud_firestore: ^6.10.0
  video_player: ^2.14.1
  firebase_ai: ^4.0.0
  firebase_app_check: ^0.4.8
  file_picker: ^13.1.0
  google_fonts: ^9.0.0
  flutter_svg: ^2.3.0
  firebase_storage: ^13.6.0
  flex_color_scheme: ^9.0.0
  pdf: ^3.13.1
  printing: ^5.15.1
  http: ^1.6.0
  cryptography: ^2.9.0
  file_saver: ^0.7.0
  archive: ^4.5.2
  local_auth: ^3.0.2
  shared_preferences: ^2.5.6
  supabase_flutter: ^2.18.3
  syncfusion_flutter_pdfviewer: ^35.1.40+1

# Packages used during development
dev_dependencies:
  # Flutter widget testing
  flutter_test:
    sdk: flutter

  # Dart and Flutter code quality rules
  flutter_lints: ^6.0.0

# Flutter-specific settings
flutter:
  # Enable Material icons
  uses-material-design: true

  assets:
    - assets/images/groceries/
    - assets/images/food/dishes/
    - assets/images/food/restaurants/
    - assets/images/food/
    - assets/images/food/dishes/
    - assets/images/food/restaurants/
    - assets/icons/
    - assets/animations/doctor_entry.mp4

  # Add a fonts section here if the app uses custom fonts.
