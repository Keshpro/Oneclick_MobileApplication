# Flutter project name
name: oneclick

# Short description of the app
description: "OneClick mobile application"

# Prevent accidental publishing to pub.dev
publish_to: 'none'

# App version and build number
version: 1.0.0+1

# Required Dart SDK version
environment:
  sdk: ^3.13.0

# Packages used by the app
dependencies:
  flutter:
    sdk: flutter

  # iOS-style icons
  cupertino_icons: ^1.0.8

  # Connect and initialize Firebase
  firebase_core: ^4.15.0

  # User registration, login, and password reset
  firebase_auth: ^6.7.0

  # Store user profiles, roles, and approval status
  cloud_firestore: ^6.10.0

# Packages used during development
dev_dependencies:
  # Flutter widget testing
  flutter_test:
    sdk: flutter

  # Dart and Flutter code quality rules
  flutter_lints: ^6.0.0

# Flutter-specific settings
flutter:
  # Enable Material icons
  uses-material-design: true

  # Uncomment these after adding files inside the folders.
  # assets:
  #   - assets/images/
  #   - assets/icons/

  # Add a fonts section here if the app uses custom fonts.